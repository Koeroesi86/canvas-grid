name: Publish

# Daily calendar-versioned release: YY.M.N (e.g. 26.11.1), N restarting at 1 each month.
# The month is not zero-padded because semver forbids leading zeros.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the version and build, but do not publish or tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  PACKAGE: '@koeroesi86/canvas-grid'

jobs:
  prepare:
    if: github.repository == 'Koeroesi86/canvas-grid'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      last: ${{ steps.version.outputs.last }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether to release and compute the version
        id: version
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"

          if [ -n "$last" ] && [ "$(git rev-list --count "$last..HEAD")" -eq 0 ]; then
            echo "No commits since $last, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prefix=$(date -u +%y.%-m)
          # highest N already used this month, from git tags and from npm
          published=$(npm view "$PACKAGE" versions --json 2>/dev/null || echo '[]')
          latest_n=$(
            {
              git tag --list "v$prefix.*" | sed 's/^v//'
              echo "$published" | jq -r 'if type == "array" then .[] else . end'
            } | grep -E "^${prefix//./\\.}\.[0-9]+$" | sed -E 's/.*\.//' | sort -n | tail -n1 || true
          )
          version="$prefix.$(( ${latest_n:-0} + 1 ))"

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (previous: ${last:-none}) from $sha" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: build

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Set version
        run: npm version --no-git-tag-version "$VERSION"
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
      - run: npm publish --provenance --access public

  release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and GitHub release
    steps:
      - name: Tag and create the GitHub release
        run: |
          args=(--target "$SHA" --generate-notes --latest)
          if [ -n "$LAST" ]; then args+=(--notes-start-tag "$LAST"); fi
          gh release create "v$VERSION" "${args[@]}" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          LAST: ${{ needs.prepare.outputs.last }}
